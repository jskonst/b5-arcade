<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>B5 Arcade — Starfury</title>
    <link rel="icon" href="data:," />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        touch-action: none;
        overscroll-behavior: none;
      }
      #game {
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      canvas {
        display: block;
        touch-action: none;
      }
      #touch-ui {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        font-family: "Courier New", Courier, monospace;
      }
      #touch-ui.is-visible {
        display: block;
      }
      #touch-ui .stick-zone,
      #touch-ui .fire-btn,
      #touch-ui .roll-btn {
        pointer-events: auto;
        touch-action: none;
        position: absolute;
        user-select: none;
        -webkit-user-select: none;
      }
      #touch-ui .stick-zone {
        left: max(12px, env(safe-area-inset-left));
        bottom: max(12px, env(safe-area-inset-bottom));
        width: 156px;
        height: 156px;
      }
      #touch-ui .stick-base {
        position: absolute;
        inset: 14px;
        border-radius: 50%;
        border: 2px solid rgba(159, 216, 255, 0.55);
        background: radial-gradient(circle at 50% 50%, rgba(20, 28, 40, 0.2), rgba(8, 12, 20, 0.5));
        box-shadow: inset 0 0 0 10px rgba(159, 216, 255, 0.05);
      }
      #touch-ui .stick-knob {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: radial-gradient(circle at 40% 35%, #ffe58a, #e2b007 55%, #8a6a00);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
        transform: translate(-50%, -50%);
      }
      #touch-ui .fire-btn {
        right: max(18px, env(safe-area-inset-right));
        bottom: max(22px, env(safe-area-inset-bottom));
        width: 92px;
        height: 92px;
        border-radius: 50%;
        border: 2px solid rgba(255, 120, 96, 0.9);
        background: rgba(255, 70, 56, 0.28);
        color: #ffe8e4;
        font-weight: 700;
        letter-spacing: 0.12em;
        font-size: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #touch-ui .fire-btn.held,
      #touch-ui .roll-btn.held {
        background: rgba(255, 214, 90, 0.72);
        color: #1a1404;
      }
      #touch-ui .roll-btn {
        width: 64px;
        height: 46px;
        border-radius: 10px;
        border: 2px solid rgba(159, 216, 255, 0.65);
        background: rgba(8, 14, 24, 0.5);
        color: #d7ecff;
        font-size: 22px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #touch-ui .roll-port {
        right: max(112px, calc(env(safe-area-inset-right) + 96px));
        bottom: max(128px, calc(env(safe-area-inset-bottom) + 116px));
      }
      #touch-ui .roll-starboard {
        right: max(22px, env(safe-area-inset-right));
        bottom: max(128px, calc(env(safe-area-inset-bottom) + 116px));
      }
      @media (max-width: 600px) {
        #touch-ui .stick-zone {
          width: 132px;
          height: 132px;
        }
        #touch-ui .fire-btn {
          width: 78px;
          height: 78px;
          font-size: 14px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
